[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disc-ripper"
version = "0.1.0"
description = "Rip, encode and burn discs from a web UI on Unraid"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/disc_ripper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
