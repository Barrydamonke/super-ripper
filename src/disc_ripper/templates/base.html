<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Disc Ripper{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/htmx-ext-sse.js"></script>
  <!-- Swap 4xx/5xx responses too, so validation errors show up in the page. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
</head>
<body>
  <header>
    <strong>Disc Ripper</strong>
    {% if request.state.logged_in %}
    <nav>
      <a href="/">Dashboard</a>
      {%- set music_count = request.app.state.services.music_waiting() %}
      <a href="/music">Music{% if music_count %} ({{ music_count }}){% endif %}</a>
      <a href="/films">Films</a>
      <a href="/presets">Presets</a>
      <a href="/drives">Drives</a>
      <a href="/settings">Settings</a>
      <form method="post" action="/logout" class="inline"><button type="submit">Log out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
