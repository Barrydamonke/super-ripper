{% extends "base.html" %}
{% block title %}Set up - Disc Ripper{% endblock %}
{% block content %}
<h1>Set the admin password</h1>
<p>This is the first start. Choose the password for the web UI.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/setup">
  <label>Password <input type="password" name="password" autocomplete="new-password" required></label>
  <label>Confirm <input type="password" name="confirm" autocomplete="new-password" required></label>
  <button type="submit">Save password</button>
</form>
{% endblock %}
