name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: disc-ripper:ci

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8580:8580 disc-ripper:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8580/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:8580/healthz
          # PID 1 is tini (root, only forwards signals); the app is its child and must run as 99.
          test "$(docker exec smoke cat /proc/1/comm)" = "tini"
          app_pid=$(docker exec smoke cat /proc/1/task/1/children | awk '{print $1}')
          test "$(docker exec smoke awk '/^Uid:/{print $2}' /proc/$app_pid/status)" = "99"
          # cyanrip (Debian trixie) must run as the app user.
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups cyanrip -V | grep -q "^cyanrip 0.9"
          # MakeMKV (built from source) and ffprobe must run as the app user.
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'HOME=/tmp makemkvcon -r info disc:9999' | grep -q '^MSG:'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups ffprobe -version | grep -q '^ffprobe version'
          # Every encoder and filter the Presets page offers must be in the image, each checked on its own so a failure names it.
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'HandBrakeCLI --help 2>&1 | grep -qw x265_10bit'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'HandBrakeCLI --help 2>&1 | grep -qw x264'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'HandBrakeCLI --help 2>&1 | grep -qw eac3'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'HandBrakeCLI --help 2>&1 | grep -qw ac3'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'HandBrakeCLI --help 2>&1 | grep -qw av_aac'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'HandBrakeCLI --help 2>&1 | grep -qw opus'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw libx265'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw libx264'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw hevc_vaapi'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw h264_vaapi'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw eac3'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw ac3'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw aac'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -encoders | grep -qw libopus'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -filters | grep -qw bwdif'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -filters | grep -qw cropdetect'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -filters | grep -qw scale_vaapi'
          docker exec smoke setpriv --reuid=99 --regid=100 --clear-groups sh -c 'ffmpeg -hide_banner -filters | grep -qw deinterlace_vaapi'
          docker logs smoke
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
